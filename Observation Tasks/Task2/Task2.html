<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Profile Generator</h1>

        <div class="form-box">

            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Roll Number:</label>
            <input type="text" id="rollNo" placeholder="Enter roll number">

            <label>Department:</label>
            <input type="text" id="department" placeholder="Enter department">

            <label>CGPA:</label>
            <input type="number" id="cgpa" step="0.01" placeholder="Enter CGPA">

            <button id="createProfile">Create Student Profile</button>

        </div>

        <div id="profileContainer"></div>

    </div>

    <script src="script.js"></script>

    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.container {
    width: 500px;
    margin: 50px auto;
    text-align: center;
}

h1 {
    color: #333;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    text-align: left;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.profile {
    margin-top: 25px;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    text-align: left;
}

.profile h2 {
    text-align: center;
    margin-bottom: 20px;
}

.profile p {
    font-size: 17px;
    margin: 12px 0;
}
    </style>
</body>
</html>
