<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task................"
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks available.</p>

    </div>

    <script src="Task3.js"></script>
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.container {
    width: 600px;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.input-section {
    display: flex;
    gap: 10px;
}

#taskInput {
    flex: 1;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 16px;
}

#addTaskBtn {
    padding: 12px 18px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

#addTaskBtn:hover {
    background: #0056b3;
}

#taskList {
    list-style: none;
    padding: 0;
    margin-top: 25px;
}

.task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background: #f9f9f9;
}

.task-text {
    flex: 1;
    font-size: 17px;
}

.completed {
    text-decoration: line-through;
    color: gray;
}

.button-group {
    display: flex;
    gap: 5px;
}

.complete-btn,
.delete-btn {
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
}

.complete-btn {
    background: #28a745;
}

.complete-btn:hover {
    background: #1e7e34;
}

.delete-btn {
    background: #dc3545;
}

.delete-btn:hover {
    background: #a71d2a;
}

#emptyMessage {
    text-align: center;
    color: gray;
    margin-top: 20px;
}
</style>

</body>
</html>
