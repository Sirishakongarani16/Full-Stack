<!DOCTYPE html>
<html>
<head>
    <title>DOM Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Document Object Model (DOM)</h1>

    <div class="container">

        <h2 id="heading">Hello Student</h2>

        <p id="message">
            This is the original content.
        </p>

        <img id="myImage"
             src="https://via.placeholder.com/200"
             alt="Original Image">

        <br><br>

        <button onclick="changeContent()">
            Change Content
        </button>

        <button onclick="changeStyle()">
            Change Style
        </button>

        <button onclick="changeAttribute()">
            Change Attribute
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
